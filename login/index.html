<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo — Agua Magaly</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="../assets/logo-magaly.png">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-logo">
      <img src="../assets/logo-magaly.png" alt="Logo Agua Magaly" width="72" height="72" style="object-fit: contain;">
      <div class="brand">Agua Magaly</div>
      <span style="font-size: 11px; font-weight: 700; color: var(--blue-mid); letter-spacing: 0.08em; text-transform: uppercase;">
        Portal Administrativo Oficial
      </span>
    </div>

    <h2>Iniciar sesión</h2>
    <div class="sub">Ingresa las credenciales autorizadas de la marca</div>

    <form id="login-form">
      <div class="form-row">
        <label for="login-user">Usuario del sistema</label>
        <input id="login-user" type="text" placeholder="Ej. admin" autocomplete="username" required autofocus>
      </div>

      <div class="form-row" style="margin-top: 14px;">
        <label for="login-pass">Contraseña</label>
        <input id="login-pass" type="password" placeholder="••••" autocomplete="current-password" required>
      </div>

      <div id="login-error"></div>

      <button type="submit" class="btn btn-primary">
        Ingresar al panel →
      </button>
    </form>

    <div class="auth-note">
      <p style="margin-bottom: 8px;">Credenciales autorizadas: Usuario <code>admin</code> · Contraseña <code>1234</code></p>
      <a href="../index.html">← Volver al sitio web principal</a>
    </div>
  </div>

  <script src="../js/auth.js"></script>
</body>
</html>
